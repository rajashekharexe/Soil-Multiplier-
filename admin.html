<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - KAD Multiplier</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #111111;
      --text: #ffffff;
      --text-muted: #888888;
      --border: #222222;
      --primary: #fbbf24;
      --success: #10b981;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }
    .header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
    }
    .header h1 {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
    }
    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .table-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 500;
      background: rgba(255, 255, 255, 0.02);
    }
    td {
      font-size: 0.95rem;
      vertical-align: top;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      background: rgba(251, 191, 36, 0.1);
      color: var(--primary);
    }
    .status-badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    .address-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 0.25rem;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    #admin-login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-login-box {
      background: var(--card-bg);
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .admin-input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: white;
      border-radius: 6px;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }
    .admin-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="admin-login-overlay">
    <div class="admin-login-box">
      <h2 style="font-family: 'Outfit'; margin-top: 0;">Admin Access</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Enter the master password to view orders.</p>
      <input type="password" id="admin-pass" class="admin-input" placeholder="Password">
      <button id="admin-submit" class="admin-btn">Unlock Dashboard</button>
      <p id="admin-error" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 1rem; display: none;">Incorrect password.</p>
    </div>
  </div>

  <div class="header">
    <h1>KAD ADMIN</h1>
    <div style="font-size: 0.9rem; color: var(--text-muted);">
      <span id="order-count">0</span> Total Orders
    </div>
  </div>

  <div class="container">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Payment & UTR</th>
            <th>Order Details</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr>
            <td colspan="6">
              <div class="loading">Loading orders from Firebase...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
